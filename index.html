<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f4c45" />
  <title>Sri Lanka 2027 · Trip planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>" />
</head>
<body>
  <!-- Login -->
  <section id="login" class="login hidden">
    <div class="login-card">
      <div class="login-mark">🌴</div>
      <h1>Sri Lanka<br /><span>January 2027</span></h1>
      <p class="muted">Sign in to plan the trip together.</p>
      <form id="loginForm" autocomplete="on">
        <label>Email<input type="email" name="email" autocomplete="username" required /></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
        <button type="submit" class="btn primary wide">Sign in</button>
        <button type="button" class="btn link" id="forgotBtn">Forgot password?</button>
        <p id="loginMsg" class="form-msg"></p>
      </form>
    </div>
  </section>

  <!-- Loading -->
  <section id="loading" class="loading"><div class="spinner"></div><p>Loading…</p></section>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">🌴</span>
        <div><strong>Sri Lanka</strong><small>12–26 Jan 2027</small></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <span id="whoami" class="muted small"></span>
        <div class="foot-actions">
          <button class="btn ghost small" data-act="settings">Settings</button>
          <button class="btn ghost small" data-act="signout">Sign out</button>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="mobile-head">
        <span class="brand-mark">🌴</span><strong id="mobileTitle">Sri Lanka 2027</strong>
        <button class="btn ghost small" data-act="settings" aria-label="Settings">⚙︎</button>
      </header>
      <div id="sync" class="sync" title="Sync status"></div>
      <div id="view" class="view"></div>
      <div id="mapPanel" class="map-panel hidden">
        <div id="mapControls"></div>
        <div id="map"></div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="app.js"></script>
</body>
</html>
